<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <!-- Andenes y calzada -->
  <rect x="0" y="0" width="560" height="110" fill="#f1efe8"/>
  <rect x="0" y="110" width="560" height="180" fill="#ecebe5"/>
  <rect x="0" y="290" width="560" height="110" fill="#f1efe8"/>
  <line x1="0" y1="110" x2="560" y2="110" stroke="#c9c6ba" stroke-width="2"/>
  <line x1="0" y1="290" x2="560" y2="290" stroke="#c9c6ba" stroke-width="2"/>
  <g stroke="#c9c6ba" stroke-width="3" stroke-dasharray="20 16">
    <line x1="0" y1="200" x2="214" y2="200"/>
    <line x1="346" y1="200" x2="560" y2="200"/>
  </g>

  <!-- Paso peatonal -->
  <g fill="#ffffff" stroke="#c9c6ba" stroke-width="1">
    <rect x="232" y="122" width="96" height="12" rx="2"/>
    <rect x="232" y="146" width="96" height="12" rx="2"/>
    <rect x="232" y="170" width="96" height="12" rx="2"/>
    <rect x="232" y="194" width="96" height="12" rx="2"/>
    <rect x="232" y="218" width="96" height="12" rx="2"/>
    <rect x="232" y="242" width="96" height="12" rx="2"/>
    <rect x="232" y="266" width="96" height="12" rx="2"/>
  </g>

  <!-- Vehículo detenido -->
  <g transform="translate(112 214)">
    <rect x="0" y="0" width="96" height="58" rx="16" fill="#ffffff" stroke="#8b8f98" stroke-width="2"/>
    <rect x="54" y="8" width="24" height="42" rx="7" fill="#e2e0d8"/>
    <rect x="14" y="10" width="18" height="38" rx="6" fill="#e2e0d8"/>
    <rect x="88" y="8" width="6" height="12" rx="3" fill="#f2b632"/>
    <rect x="88" y="38" width="6" height="12" rx="3" fill="#f2b632"/>
  </g>

  <!-- Poste con semáforo y baliza -->
  <g>
    <rect x="347" y="30" width="6" height="64" rx="3" fill="#0d1117"/>
    <rect x="364" y="16" width="20" height="46" rx="7" fill="#0d1117"/>
    <circle cx="374" cy="27" r="4.5" fill="#e23b2e"/>
    <circle cx="374" cy="39" r="4.5" fill="#f2b632"/>
    <circle cx="374" cy="51" r="4.5" fill="#3fae49"/>
    <rect x="353" y="36" width="11" height="4" fill="#0d1117"/>
    <rect x="337" y="62" width="26" height="18" rx="5" fill="#14795a"/>
    <circle cx="350" cy="71" r="3" fill="#e6f2ed"/>
  </g>

  <!-- Ondas de radio de la baliza -->
  <g stroke="#14795a" stroke-width="3" stroke-linecap="round">
    <path d="M354.9 101.6A28 28 0 0 1 332 95.4" stroke-opacity="0.9"/>
    <path d="M357.6 117.3A44 44 0 0 1 321.7 107.7" stroke-opacity="0.6"/>
    <path d="M360.4 133.1A60 60 0 0 1 311.4 120" stroke-opacity="0.35"/>
  </g>

  <!-- Rumbo del cruce -->
  <path d="M280 318V110" stroke="#14795a" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 9"/>
  <path d="M268 124L280 108L292 124" stroke="#14795a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peatón visto desde arriba -->
  <g transform="translate(280 346)">
    <path d="M-22 6A22 14 0 0 1 22 6V12A22 14 0 0 1-22 12Z" fill="#4b5563"/>
    <circle cx="0" cy="0" r="12" fill="#0d1117"/>
    <circle cx="26" cy="12" r="6" fill="#b9791a" stroke="#0d1117" stroke-width="1.5"/>
    <g stroke="#b9791a" stroke-width="2" stroke-linecap="round">
      <path d="M36 4L41 1"/>
      <path d="M38 12H44"/>
      <path d="M36 20L41 23"/>
    </g>
  </g>

  <!-- Arco de orientación -->
  <path d="M258 304A30 30 0 0 1 302 304" stroke="#b9791a" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
</svg>

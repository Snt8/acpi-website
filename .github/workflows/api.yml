name: API

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    name: Probar
    runs-on: ubuntu-latest
    # PostgreSQL de verdad para las pruebas de la migración (tests/test_database.py)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACPI_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version-file: api/.python-version
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Revisar el código
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas
        run: pytest
